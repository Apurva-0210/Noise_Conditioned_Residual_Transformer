services:
  - type: web
    name: massive-mimo-ai-api
    runtime: python
    rootDir: web_app/backend
    buildCommand: pip install -U pip setuptools && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
    plan: free
    autoDeploy: true
